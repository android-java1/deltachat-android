name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [main]
  schedule:
    - cron: '0 21 * * 5'
  workflow_dispatch:
    inputs:
      languages:
        description: "Languages to analyze"
        required: true
        default: "java-kotlin"

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # 'java-kotlin' is CodeQL's language identifier for the whole JVM/Java
        # family (it replaced the deprecated 'java'); it is the correct value
        # even though this project is 100% Java with no Kotlin sources.
        # The C/JNI code (jni/dc_wrapper.c + the Rust core) would require the
        # NDK/CMake native build and is intentionally left out to keep the
        # scan reliable.
        # On manual runs the language comes from the workflow_dispatch input;
        # on push/pull_request/schedule it defaults to 'java-kotlin'.
        # https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning#changing-the-languages-that-are-analyzed
        language: ${{ fromJSON(format('["{0}"]', github.event.inputs.languages || 'java-kotlin')) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: manual

      # Compile the Java sources of the 'foss' debug variant so CodeQL can
      # trace the compilation. This is a single-module project: the root
      # project itself applies 'com.android.application', so there is no ':app'
      # subproject and the task has no ':app:' prefix. The product flavors are
      # 'foss' and 'gplay' (there is no 'general' flavor); 'foss' is chosen
      # because it needs neither Google Play Services nor Firebase.
      #
      # We deliberately run the Java compile task rather than 'assemble', so the
      # build does NOT invoke the CMake/NDK native build (ndkVersion
      # 27.0.12077973), which is not needed for java-kotlin analysis. The JNI
      # Java bindings (com.b44t.messenger.Dc*) live in src/main/java, not in the
      # 'jni/deltachat-core-rust' git submodule, so the submodule is not fetched.
      # The Android SDK and its licenses are preinstalled on the ubuntu-latest
      # runner; missing platform/build-tools are auto-downloaded.
      - name: Build (Java sources)
        run: ./gradlew :compileFossDebugJavaWithJavac --no-daemon --stacktrace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
